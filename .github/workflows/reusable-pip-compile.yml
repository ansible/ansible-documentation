---
name: "Refresh pinned dependencies"

"on":
  workflow_call:
    inputs:
      # Commit messae and PR title
      message:
        type: string
        required: true
      # Branch to create PR from
      pr-branch:
        type: string
        required: true
      # Branch to base PR on
      base-branch:
        type: string
        required: true
      # Nox session to call
      nox-args:
        type: string
        required: true
      # Files to commit
      changed-files:
        default: "tests/*.txt"
        type: string
        required: false
      # Reset branch
      reset-branch:
        type: boolean
        default: false
      labels:
        type: string
        default: ""
      python-versions:
        type: string
        required: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: github-bot
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: "${{ inputs.base-branch }}"
          persist-credentials: false
      - name: Fetch required contents of ansible-core
        run: |
          python docs/bin/clone-core.py
      - name: Set up nox
        uses: wntrblm/nox@a976d7ee04ab7a13634adc1016d4755a1348225f # 2026.08.17
        with:
          python-versions: "${{ inputs.python-versions }}"
      - name: Set up git committer
        run: |
          hacking/get_bot_user.sh "ansible-documentation-bot" "Ansible Documentation Bot"
      - name: "Use a branch named ${{ inputs.pr-branch }}"
        env:
          base_branch: "${{ inputs.base-branch }}"
          pr_branch: "${{ inputs.pr-branch }}"
        id: branch
        run: |
          set -x
          if git branch -r | grep "origin/${pr_branch}"; then
            echo "branch-exists=true" >> "${GITHUB_OUTPUT}"
            git switch "${pr_branch}"
            ${{ inputs.reset-branch && 'git reset --hard' || 'git rebase' }} \
              "${base_branch}"
          else
            echo "branch-exists=false" >> "${GITHUB_OUTPUT}"
            git switch -c "${pr_branch}"
          fi
      - name: "Run nox ${{ inputs.nox-args }}"
        env:
          # Ensure the latest pip version is used
          VIRTUALENV_DOWNLOAD: '1'
        # nox-args is defined statically in the calling workflows and passing it
        # as a shell variable presents quoting issues, so ignore zizmor error
        # for now.
        # zizmor: ignore[template-injection]
        run: |
          nox ${{ inputs.nox-args }}
      - name: Generate temp GITHUB_TOKEN
        id: create_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # We could rely on the checkout action to persist the token in the
      # repository config, but this way, we can prevent the previous steps
      # from having unnecessary access.
      - name: "Set up token authentication"
        run: gh auth setup-git --force --hostname github.com
      - name: Push new dependency versions and create a PR
        env:
          GITHUB_TOKEN: ${{ steps.create_token.outputs.token }}
          base_branch: "${{ inputs.base-branch }}"
          pr_branch: "${{ inputs.pr-branch }}"
          message: "${{ inputs.message }}"
          pr_title: "[${{ inputs.base-branch }}] ${{ inputs.message }}"
          changed_files: "${{ inputs.changed-files }}"
          labels: "${{ inputs.labels }}"
          branch_exists: "${{ steps.branch.outputs.branch-exists }}"
        run: |
          set -x
          git diff || :
          # shellcheck disable=SC2086
          git add ${changed_files}
          # shellcheck disable=SC2086
          if git diff-index --quiet HEAD ${changed_files}; then
            echo "Nothing to do!"
            exit
          fi

          git commit -m "${message}"
          git push --force origin "${pr_branch}"

          if [ "${branch_exists}" = "true" ]; then
            # https://github.com/cli/cli/discussions/5792#discussioncomment-10410197
            current_pr="$(gh pr list \
              --head "${pr_branch}"\
              --app ansible-documentation-bot \
              --state open \
              --json url --jq .[].url \
            )"
            if [ -n "${current_pr}" ]; then
              echo "PR already exists: ${current_pr}"
              exit
            fi
          fi
          command=(gh pr create
            --base "${base_branch}"
            --title "${pr_title}"
            --body ""
            --label dependency_update
          )
          # Add custom labels to the command.
          old_ifs="$IFS"
          IFS=","
          for label in ${labels}; do
            command+=("--label" "${label}")
          done
          IFS="${old_ifs}"
          "${command[@]}"
